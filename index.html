<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>천천히 해도 괜찮아요 - 스마트폰 생활 퀴즈</title>
<meta name="description" content="경비노동자를 위한 스마트폰 생활 퀴즈. 로그인 없이 주제를 골라 상황형 퀴즈를 풀어봅니다." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <!-- 1. 시작 화면 -->
  <section id="screen-start" class="screen active">
    <div class="eyebrow">경비노동자 스마트폰 생활 퀴즈</div>
    <h1>천천히 해도 괜찮아요</h1>
    <p class="lede">생활에서 자주 만나는 스마트폰 상황을 함께 풀어봅니다.</p>

    <div class="access-row">
      <button id="btn-big-text" class="access-toggle" aria-pressed="false" type="button">글자 크게</button>
      <button id="btn-speech" class="access-toggle" aria-pressed="true" type="button">문제 읽어 주기</button>
    </div>

    <div class="button-stack">
      <button id="btn-class-quiz" class="big-btn" type="button">오늘 수업 퀴즈</button>
      <button id="btn-solo-quiz" class="secondary-btn" type="button">혼자 다시 연습하기</button>
    </div>

    <p class="privacy-note">이름이나 전화번호를 입력하지 않습니다. 회원가입 없이 바로 시작합니다.</p>
  </section>

  <!-- 2. 주제 선택 화면 -->
  <section id="screen-topics" class="screen">
    <button id="btn-topics-back" class="ghost-btn" type="button">← 처음으로</button>
    <h2>어떤 주제를 연습할까요?</h2>
    <p class="lede">카드를 누르면 바로 시작해요.</p>
    <div id="topic-list" class="topic-grid"></div>
  </section>

  <!-- 3. 연습 안내 화면 -->
  <section id="screen-info" class="screen">
    <button id="btn-info-back" class="ghost-btn" type="button">← 주제 다시 고르기</button>
    <div class="card">
      <h2>연습 안내</h2>
      <p><strong id="info-topic-names"></strong></p>
      <p id="info-count" class="lede"></p>
      <p class="lede">점수를 겨루는 시험이 아니에요. 중간에 나가도 다시 시작할 수 있어요.</p>
      <p class="lede">다시 풀 때마다 문항과 선택지 순서가 새로 섞여요.</p>
    </div>
    <button id="btn-info-start" class="big-btn" type="button">시작하기</button>
  </section>

  <!-- 4. 퀴즈 화면 -->
  <section id="screen-quiz" class="screen">
    <div class="progress-wrap">
      <div class="progress-track"><div id="quiz-progress-bar" class="progress-bar"></div></div>
      <span id="quiz-progress-text" class="progress-text"></span>
    </div>
    <span id="quiz-topic-tag" class="topic-tag"></span>

    <p id="quiz-situation" class="situation-card" hidden></p>
    <h2 id="quiz-prompt" class="quiz-prompt"></h2>

    <div id="quiz-choices" class="choices"></div>

    <div id="quiz-feedback" class="feedback" hidden></div>

    <div class="quiz-footer-row">
      <button id="btn-quiz-exit" class="ghost-btn" type="button">나가기</button>
      <button id="btn-quiz-next" class="big-btn" type="button" hidden>다음 문항</button>
    </div>
  </section>

  <!-- 5. 결과 화면 -->
  <section id="screen-result" class="screen">
    <h2>수고하셨습니다</h2>
    <p id="result-message" class="lede"></p>
    <div id="result-summary" class="result-summary"></div>

    <div class="button-stack">
      <button id="btn-retry-wrong" class="big-btn" type="button" hidden></button>
      <button id="btn-retry-all" class="secondary-btn" type="button">처음부터 다시 풀기 (순서 랜덤)</button>
      <button id="btn-result-topics" class="secondary-btn" type="button">다른 주제 고르기</button>
      <button id="btn-result-home" class="ghost-btn" type="button">처음 화면으로</button>
    </div>
  </section>

  <footer class="app-footer">천천히 해도 괜찮아요 · 오답을 확인하는 연습장입니다</footer>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
